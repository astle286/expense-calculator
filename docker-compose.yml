version: '3.8'

services:
  web:
    build: .
    ports:
      - "7000:7000"
    depends_on:
      - db
    environment:
      - FLASK_ENV=development
      - SECRET_KEY=supersecretkey
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/expenses
      - ENABLE_METRICS=true
      - LOG_LEVEL=INFO
    volumes:
      - ./logs:/app/logs   # mount host ./logs to container /app/logs

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: expenses
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
